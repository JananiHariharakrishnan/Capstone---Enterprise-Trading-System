[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "analytics-etl"
version = "0.1.0"
requires-python = ">=3.10"

dependencies = [
    "requests",
    "pandas",
    "plotly",
    "duckdb",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
analytics-etl = "analytics_etl.cli:main"
analytics-dashboard = "analytics_etl.charts:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["analytics_etl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]